<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8">
        <title>留言板</title>
        <meta name="author" content="我">
        <meta name="description" content="首頁">
        <meta name="keywords" content="網站">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/main.css" rel="stylesheet">
        <script src="js/sheet.js" defer></script>
    </head>
    <body>
        <div id="titleDiv">
          <h1>留言板</h1>
        </div>
        <div id="tipDiv">
          <div id="loading" class="tip" hidden><p>方在載入</p></div>
          <div id="sending" class="tip" hidden><p>方在發布</p></div>
        </div>
        <div id="chatDiv"></div>
        <div id="inputDiv">
          <input id="inputBoxUser" type="text" placeholder="使用者名稱"></input>
          <input id="inputBoxMessage" type="text" placeholder="訊息內容"></input>
          <button id="postBtn" onclick="post()">發布</button>
          <button id="getBtn" onclick="get()">刷新</button>
        </div>
    </body>
</html>
